<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title description">
  <title id="title">Veronica Pletsch portfolio experience map</title>
  <desc id="description">A diagram showing the default retro desktop and classic portfolio modes, their two-way switches, and their shared portfolio destinations.</desc>
  <defs>
    <style>
      .title { fill: #281426; font-family: Georgia, serif; font-size: 58px; font-weight: 700; }
      .subtitle { fill: #6c5469; font-family: Arial, sans-serif; font-size: 24px; }
      .eyebrow { fill: #84697f; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .mode-title { fill: #281426; font-family: Georgia, serif; font-size: 32px; font-weight: 700; }
      .node-title { fill: #281426; font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; }
      .node-copy { fill: #694f67; font-family: Arial, sans-serif; font-size: 16px; }
      .route-label { fill: #6d3f72; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .tiny { fill: #80677d; font-family: Arial, sans-serif; font-size: 14px; }
      .footer { fill: #5d465a; font-family: Arial, sans-serif; font-size: 17px; }
    </style>
    <marker id="arrow-neutral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8e7389"/>
    </marker>
    <marker id="arrow-retro" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#a84b85"/>
    </marker>
    <marker id="arrow-classic" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4c8889"/>
    </marker>
    <marker id="arrow-shared" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5d9e84"/>
    </marker>
  </defs>

  <rect width="1800" height="1260" fill="#fff9fd"/>
  <rect x="0" y="0" width="1800" height="16" fill="#8f2ca4"/>
  <rect x="0" y="16" width="1800" height="5" fill="#f0b4de"/>

  <text x="90" y="108" class="title">Portfolio experience map</text>
  <text x="90" y="148" class="subtitle">A two-mode information architecture that pairs playful interaction design with familiar portfolio navigation.</text>
  <line x1="90" y1="180" x2="1710" y2="180" stroke="#e4cadf" stroke-width="2"/>

  <g transform="translate(90 212)">
    <circle cx="8" cy="8" r="7" fill="#a84b85"/>
    <text x="24" y="14" class="tiny">Retro desktop experience</text>
    <circle cx="270" cy="8" r="7" fill="#4c8889"/>
    <text x="286" y="14" class="tiny">Classic portfolio experience</text>
    <circle cx="536" cy="8" r="7" fill="#5d9e84"/>
    <text x="552" y="14" class="tiny">Shared content destination</text>
  </g>

  <text x="90" y="280" class="eyebrow">ENTRY POINT</text>
  <g>
    <rect x="650" y="300" width="500" height="94" rx="18" fill="#f5eaf7" stroke="#8f2ca4" stroke-width="3"/>
    <text x="690" y="343" class="node-title">veronicapletsch.com</text>
    <text x="690" y="372" class="node-copy">Default landing URL</text>
  </g>

  <path d="M770 394 C690 435, 520 435, 375 472" fill="none" stroke="#a84b85" stroke-width="3" marker-end="url(#arrow-retro)"/>
  <path d="M1030 394 C1110 435, 1280 435, 1425 472" fill="none" stroke="#4c8889" stroke-width="3" marker-end="url(#arrow-classic)"/>
  <text x="454" y="424" class="route-label">default route</text>
  <text x="1150" y="424" class="route-label">alternate route</text>

  <g>
    <rect x="90" y="462" width="570" height="386" rx="22" fill="#fdf3fa" stroke="#a84b85" stroke-width="3"/>
    <rect x="90" y="462" width="570" height="64" rx="22" fill="#f1d6e8"/>
    <rect x="90" y="502" width="570" height="24" fill="#f1d6e8"/>
    <text x="126" y="503" class="mode-title">01 · Retro desktop mode</text>
    <text x="126" y="556" class="tiny">Default entry · immersive system simulation</text>

    <rect x="126" y="584" width="220" height="100" rx="12" fill="#ffffff" stroke="#d5b7cb" stroke-width="2"/>
    <text x="148" y="621" class="node-title">Power on</text>
    <text x="148" y="649" class="node-copy">User initiates the</text>
    <text x="148" y="671" class="node-copy">computer experience</text>

    <rect x="402" y="584" width="220" height="100" rx="12" fill="#ffffff" stroke="#d5b7cb" stroke-width="2"/>
    <text x="424" y="621" class="node-title">Boot sequence</text>
    <text x="424" y="649" class="node-copy">POST, diagnostics,</text>
    <text x="424" y="671" class="node-copy">message, welcome</text>
    <path d="M346 634 L402 634" fill="none" stroke="#8e7389" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>

    <rect x="126" y="724" width="496" height="86" rx="12" fill="#ffffff" stroke="#d5b7cb" stroke-width="2"/>
    <text x="148" y="760" class="node-title">Desktop dashboard</text>
    <text x="148" y="788" class="node-copy">8 pixel shortcuts · custom footer · animated cursor · taskbar tabs</text>
    <path d="M512 684 L512 724" fill="none" stroke="#8e7389" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  </g>

  <g>
    <rect x="1140" y="462" width="570" height="386" rx="22" fill="#f3fbfb" stroke="#4c8889" stroke-width="3"/>
    <rect x="1140" y="462" width="570" height="64" rx="22" fill="#d8efef"/>
    <rect x="1140" y="502" width="570" height="24" fill="#d8efef"/>
    <text x="1176" y="503" class="mode-title">02 · Classic portfolio mode</text>
    <text x="1176" y="556" class="tiny">Original layout · direct, familiar exploration</text>

    <rect x="1176" y="584" width="220" height="100" rx="12" fill="#ffffff" stroke="#b6d6d6" stroke-width="2"/>
    <text x="1198" y="621" class="node-title">Classic home</text>
    <text x="1198" y="649" class="node-copy">Hero, latest work,</text>
    <text x="1198" y="671" class="node-copy">About Me, photos</text>

    <rect x="1452" y="584" width="220" height="100" rx="12" fill="#ffffff" stroke="#b6d6d6" stroke-width="2"/>
    <text x="1474" y="621" class="node-title">Direct navigation</text>
    <text x="1474" y="649" class="node-copy">Navbar + featured</text>
    <text x="1474" y="671" class="node-copy">project cards</text>
    <path d="M1396 634 L1452 634" fill="none" stroke="#8e7389" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>

    <rect x="1176" y="724" width="496" height="86" rx="12" fill="#ffffff" stroke="#b6d6d6" stroke-width="2"/>
    <text x="1198" y="760" class="node-title">Traditional portfolio path</text>
    <text x="1198" y="788" class="node-copy">Fast scanning, accessible routes, and three featured project entry points</text>
    <path d="M1562 684 L1562 724" fill="none" stroke="#8e7389" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  </g>

  <path d="M660 767 C825 767, 975 676, 1140 676" fill="none" stroke="#a84b85" stroke-width="3" marker-end="url(#arrow-retro)"/>
  <rect x="730" y="700" width="340" height="44" rx="22" fill="#fff9fd" stroke="#d9bacf" stroke-width="2"/>
  <text x="755" y="728" class="route-label">Taskbar: “Exit out of retro desktop”</text>

  <path d="M1140 598 C970 494, 820 494, 660 568" fill="none" stroke="#4c8889" stroke-width="3" marker-end="url(#arrow-classic)"/>
  <rect x="746" y="476" width="310" height="44" rx="22" fill="#fff9fd" stroke="#b9d8d8" stroke-width="2"/>
  <text x="774" y="504" class="route-label">Top left: “Switch to retro desktop”</text>

  <text x="90" y="914" class="eyebrow">SHARED PORTFOLIO CONTENT</text>
  <g>
    <rect x="90" y="936" width="1620" height="212" rx="22" fill="#f5fbf8" stroke="#5d9e84" stroke-width="3"/>
    <text x="128" y="980" class="mode-title">Stable destination layer</text>
    <text x="128" y="1012" class="node-copy">Both modes share the same body of work; only the entry and interaction pattern change.</text>

    <rect x="128" y="1042" width="198" height="64" rx="10" fill="#ffffff" stroke="#bbd9ca" stroke-width="2"/>
    <text x="150" y="1081" class="node-title">Projects</text>
    <rect x="350" y="1042" width="230" height="64" rx="10" fill="#ffffff" stroke="#bbd9ca" stroke-width="2"/>
    <text x="372" y="1081" class="node-title">UX &amp; Product Design</text>
    <rect x="604" y="1042" width="202" height="64" rx="10" fill="#ffffff" stroke="#bbd9ca" stroke-width="2"/>
    <text x="626" y="1081" class="node-title">Presentations</text>
    <rect x="830" y="1042" width="214" height="64" rx="10" fill="#ffffff" stroke="#bbd9ca" stroke-width="2"/>
    <text x="852" y="1081" class="node-title">Writing Samples</text>
    <rect x="1068" y="1042" width="184" height="64" rx="10" fill="#ffffff" stroke="#bbd9ca" stroke-width="2"/>
    <text x="1090" y="1081" class="node-title">Resume</text>
    <rect x="1276" y="1042" width="396" height="64" rx="10" fill="#ffffff" stroke="#bbd9ca" stroke-width="2"/>
    <text x="1298" y="1070" class="node-title">About Me + Contact</text>
    <text x="1298" y="1094" class="node-copy">Sabrina shortcut intentionally reuses About Me</text>
  </g>

  <path d="M382 848 C410 890, 500 906, 620 936" fill="none" stroke="#5d9e84" stroke-width="3" marker-end="url(#arrow-shared)"/>
  <text x="362" y="886" class="route-label">Shortcut → embedded pop-up window</text>
  <path d="M1418 848 C1385 892, 1310 908, 1190 936" fill="none" stroke="#5d9e84" stroke-width="3" marker-end="url(#arrow-shared)"/>
  <text x="1246" y="886" class="route-label">Navbar / card → direct page route</text>

  <text x="90" y="1202" class="footer">UX rationale: give visitors a memorable experiential path without removing the fast, familiar path recruiters expect.</text>
  <text x="90" y="1234" class="tiny">Current architecture · two modes · one reusable content system</text>
</svg>
